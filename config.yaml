# ==========================================================
# macro-data / config.yaml   —   v2
# 20 Aug 2026 ke feed test ke baad update ki gayi
# ==========================================================
# BADLI HUI CHEEZ:
# Pehle har feed par ek hi 14-din ka paimana tha. Wo ghalat
# tha. Kuch feeds asal mein sust hain, marre nahi — Fed
# speeches, BEA (mahine mein ek baar), CME margin notices.
#
# Ab har feed ka apna "cadence_days" hai = is feed se kitne
# din mein nayi cheez aani chahiye. Verdict usi se banega.
# ==========================================================

settings:
  timezone: "Asia/Karachi"        # PKT = UTC+5, DST nahi
  trading_day_start_hour: 3       # trading day 3:00 AM PKT se
  keep_trading_days: 5            # DISK par kitne din ka data rehta hai
  catchup_runs: 3                 # naye trading day ke SHURU ke itne run
                                  # pichhle din ka bacha hua data bhi
                                  # samet-te hain. CME raat 02:00-02:20
                                  # PKT par deta hai — 3 AM ki hadd se
                                  # theek pehle — is liye ye zaroori hai.
                                  # Ginti se chalta hai, waqt se nahi,
                                  # taake GitHub late chale to bhi ho.

  recovery_days: 1                # kitne din peechay tak ki NAYI khabar
                                  # qabool hogi. 1 = sirf aaj ka trading
                                  # day. Is se purani khabar rad ho jayegi
                                  # chahe feed mein abhi maujood ho.
  request_timeout: 20
  retries: 3
  # Feed ki umar > cadence_days x is number  ->  STALE
  stale_multiplier: 3
  warn_multiplier: 1.5
  # NOTE: max_items_in_pack aur max_per_source hata diye gaye.
  # Ab kuch kaat-ta nahi — sab kuch mehfooz hota hai, sirf TAG
  # lagta hai. Noise baad mein keywords behtar kar ke chhaanenge.

# ==========================================================
# TIER 1 — reeddh ki haddi. Roz taza, aur seedha kaam ka.
# ==========================================================
feeds_tier1:

  - name: investinglive
    url: "https://investinglive.com/feed/"
    weight: 10
    cadence_days: 1
    # Poora text + unwaan mein actual vs expected. Sab se ahem.

  - name: fxstreet_news
    url: "https://www.fxstreet.com/rss/news"
    weight: 8
    cadence_days: 1

  - name: fxstreet_analysis
    url: "https://www.fxstreet.com/rss/analysis"
    weight: 7
    cadence_days: 1

  - name: actionforex
    url: "https://www.actionforex.com/feed/"
    weight: 7
    cadence_days: 1

  - name: marketpulse
    url: "https://www.marketpulse.com/feed/"
    weight: 6
    cadence_days: 2               # sirf 3 items dete hain, kam likhte hain

  - name: wsj_economy
    url: "https://feeds.content.dowjones.io/public/rss/socialeconomyfeed"
    weight: 8
    cadence_days: 1
    # Test mein "U.S. Leading Indicators Ticked Up in July" — theek macro

# ==========================================================
# CME — exchange ka apna rozana khulasa
# ----------------------------------------------------------
# Ye videos hain, magar UNWAAN khud ek line ka market summary
# hai. Sirf title lena hai, video ki zaroorat nahi.
# ==========================================================
feeds_cme:

  - name: cme_metals_video
    url: "https://www.cmegroup.com/rss/metals-video-commentary.rss"
    weight: 9
    cadence_days: 1
    tag: gold                     # XAUUSD — aap ka pehla asset

  - name: cme_fx_video
    url: "https://www.cmegroup.com/rss/fx-video-commentary.rss"
    weight: 9
    cadence_days: 1
    tag: fx

  - name: cme_rates_video
    url: "https://www.cmegroup.com/rss/interestrates-video-commentary.rss"
    weight: 9
    cadence_days: 1
    tag: rates

  - name: cme_energy_video
    url: "https://www.cmegroup.com/rss/energy-video-commentary.rss"
    weight: 6
    cadence_days: 1
    tag: oil

  - name: cme_daily_commentary
    url: "https://www.cmegroup.com/rss/daily-market-commentary-videos.rss"
    weight: 4
    cadence_days: 1
    keyword_filter: true
    # Mila jula feed — is mein cattle aur soybeans bhi aate hain.
    # Is liye is par keyword filter lagta hai (baqi CME feeds par nahi).

  - name: cme_risk_management
    url: "https://www.cmegroup.com/rss/cme-risk-management-feed.rss"
    weight: 7
    cadence_days: 10
    # Margin changes tradeable khabar hai — margin barhne par
    # gold/silver mein majboori ki liquidation aati hai.
    # Ye kabhi kabhi aata hai, is liye cadence lamba rakha hai.

# ==========================================================
# CENTRAL BANKS — sarkari, sab se sacha zariya
