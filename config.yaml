# ==========================================================
# KEYWORDS — item pack mein tabhi jayegi jab koi lafz mile.
# Central bank, CME aur data feeds is se mustasna — un ki
# har cheez le li jayegi.
# ==========================================================
keyword_exempt_groups:
  - feeds_centralbank
  - feeds_cme

keywords:
  usd:    [dollar, dxy, fed, fomc, powell, warsh, treasury, yields, cpi, pce,
           nfp, payrolls, jobless, ism, pmi, "retail sales", gdp, inflation,
           buyback, auction, usd, "jobless claims", "philly fed"]
  eur:    [ecb, lagarde, euro, eurozone, "euro area", bund, hicp, germany,
           german, france, eur, bundesbank,
           "eur/usd", eurusd, "eur/gbp", eurgbp, "eur/jpy", eurjpy, "eur/chf"]
  gbp:    [boe, bailey, sterling, gilt, "uk inflation", gbp,
           "bank of england", "office for national statistics",
           "pound sterling", "british pound",
           # NOTE: akela "pound" JAAN BOOJH KAR nahi hai — copper
           # "per pound" bikta hai aur "Copper Rises as Supply
           # Concerns Persist" GBP section mein chali jati thi.
           "gbp/usd", gbpusd, "gbp/jpy", gbpjpy, cable]
  jpy:    [boj, ueda, yen, japan, japanese, intervention, jpy,
           "bank of japan", nikkei, topix,
           "usd/jpy", usdjpy, "aud/jpy", "gbp/jpy"]
  chf:    [snb, "swiss franc", switzerland, chf,
           "usd/chf", usdchf, "eur/chf"]
  cad:    [boc, macklem, loonie, "canadian dollar", canada, canadian, cad,
           "usd/cad", usdcad]
  aud:    [rba, bullock, aussie, "australian dollar", australia,
           australian, aud,
           "aud/usd", audusd, "aud/jpy"]
  nzd:    [rbnz, kiwi, "new zealand", nzd,
           "nzd/usd", nzdusd]
  gold:   [gold, xau, bullion, precious metals, silver, real yields, breakeven,
           "xau/usd", xauusd, xau, "xag/usd", xagusd, xag, comex]
  oil:    [oil, wti, brent, opec, crude, hormuz, "eia inventories", diesel]
  risk:   [tariff, tariffs, sanctions, war, geopolitical, iran, escalation,
           ceasefire, vix, "risk-off", selloff, russia, ukraine]
  crypto: [bitcoin, btc, ethereum, ether, crypto, cryptocurrency, altcoin,
           stablecoin, coinbase]
  rates:  ["rate hike", "rate cut", hawkish, dovish, minutes, bid-to-cover,
           margin]

# ==========================================================
# FRED SERIES  —  Phase 2
# ----------------------------------------------------------
# kind: daily / weekly / monthly / quarterly
#   daily    -> 1d, 5d, 20d change + 2-saal ka percentile
#   weekly   -> hafta-war change
#   monthly  -> MoM aur YoY
#   quarterly-> QoQ aur YoY
#
# key GitHub Secret "FRED_API_KEY" mein hai, code mein nahi.
# ==========================================================

fred_groups:

  rates_yields:
    label: "Rates aur Yields"
    series:
      - {id: DFEDTARU,  kind: daily,  name: "Fed funds target (upper)", unit: "%"}
      - {id: DGS2,      kind: daily,  name: "US 2Y yield",  unit: "%"}
      - {id: DGS10,     kind: daily,  name: "US 10Y yield", unit: "%"}
      - {id: DGS30,     kind: daily,  name: "US 30Y yield", unit: "%"}
      - {id: T10Y2Y,    kind: daily,  name: "10Y-2Y spread", unit: "%"}
      - {id: T10Y3M,    kind: daily,  name: "10Y-3M spread", unit: "%"}

  gold_drivers:
    label: "Gold ke asal drivers"
    series:
      - {id: DFII10,    kind: daily,  name: "10Y REAL yield (TIPS)", unit: "%"}
      - {id: DFII5,     kind: daily,  name: "5Y REAL yield (TIPS)",  unit: "%"}
      - {id: T10YIE,    kind: daily,  name: "10Y breakeven inflation", unit: "%"}
      - {id: T5YIE,     kind: daily,  name: "5Y breakeven inflation",  unit: "%"}
      - {id: DTWEXBGS,  kind: daily,  name: "Broad dollar index", unit: "idx"}

  risk:
    label: "Risk aur stress"
    series:
      - {id: VIXCLS,       kind: daily, name: "VIX", unit: ""}
      - {id: BAMLH0A0HYM2, kind: daily, name: "High-yield credit spread", unit: "%"}
      - {id: STLFSI4,      kind: daily, name: "Financial stress index", unit: ""}

  inflation:
    label: "Inflation"
    series:
      - {id: CPIAUCSL,  kind: monthly, name: "CPI (headline)", unit: "idx"}
      - {id: CPILFESL,  kind: monthly, name: "Core CPI", unit: "idx"}
      - {id: PCEPILFE,  kind: monthly, name: "Core PCE (Fed ka hadaf)", unit: "idx"}
      - {id: PPIFIS,    kind: monthly, name: "PPI final demand", unit: "idx"}

  labour:
    label: "Labour"
    series:
      - {id: PAYEMS,        kind: monthly, name: "Nonfarm payrolls", unit: "k"}
      - {id: UNRATE,        kind: monthly, name: "Unemployment rate", unit: "%"}
      - {id: CES0500000003, kind: monthly, name: "Average hourly earnings", unit: "$"}
      - {id: ICSA,          kind: weekly,  name: "Initial jobless claims", unit: ""}

  growth:
    label: "Growth"
    series:
      - {id: RSAFS,   kind: monthly,   name: "Retail sales", unit: "$m"}
      - {id: INDPRO,  kind: monthly,   name: "Industrial production", unit: "idx"}
      - {id: GDPC1,   kind: quarterly, name: "Real GDP", unit: "$b"}

fred_settings:
  history_years: 3            # percentile aur YoY ke liye
  sleep_between_calls: 0.3    # FRED ki had 120/minute hai
  timeout: 25

# ==========================================================
# TAG WEIGHTS
# ----------------------------------------------------------
# Khabar us section mein jati hai jis ka score sab se zyada ho.
# Score = kitne keywords mile  x  neeche wala weight.
#
# USD aur rates ka weight kam kyun:
#   Har macro khabar mein dollar, yields aur Fed ka zikr hota
#   hai. Agar sab barabar hote to USD har cheez kha jata.
#   Misal: "Gold pulls back as US yields recover after Treasury
#   buyback" — is mein USD ke 4 lafz hain aur gold ke 3, magar
#   khabar gold ki hai. Weight ke baad gold jeet-ta hai.
#   USD tab hi jeet-ta hai jab khabar SIRF dollar ki ho.
# ==========================================================
tag_weights:
  gold:  1.0
  oil:   1.0
  eur:   1.0
  gbp:   1.0
  jpy:   1.0
  chf:   1.0
  cad:   1.0
  aud:   1.0
  nzd:   1.0
  crypto: 0.8
  risk:  0.7
  usd:   0.5
  rates: 0.4

# ==========================================================
# CLEANUP
# ==========================================================
cleanup:
  strip_html: true
  strip_inline_styles: true
  max_chars_per_item: 1500
  dedupe_title_similarity: 0.85
