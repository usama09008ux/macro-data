    weight: 4
    cadence_days: 1

  - name: gnews_centralbanks
    url: "https://news.google.com/rss/search?q=ECB+OR+%22Bank+of+England%22+OR+%22Bank+of+Japan%22+rates+when:1d&hl=en-US&gl=US&ceid=US:en"
