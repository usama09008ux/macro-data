name: Test APIs

# Sirf jaanchne ke liye. Koi data nahi banata, repo mein kuch nahi likhta.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repo ki copy lo
        uses: actions/checkout@v4

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install -r requirements.txt

      - name: Endpoints jaancho
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python test_apis.py
