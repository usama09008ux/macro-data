name: Fetch News

on:
  schedule:
    - cron: "*/5 * * * *"     # har 5 minute
  workflow_dispatch:          # button se bhi chala sakte hain

permissions:
  contents: write

# Do run ek sath na chalen. Warna dono ek hi waqt push karenge
# aur ek nakaam ho jayega.
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo ki copy lo
        uses: actions/checkout@v4

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Libraries install karo
        run: pip install -r requirements.txt

      - name: Khabrein uthao
        run: python fetch_news.py

      - name: Data repo mein daalo
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -A output/

          # Agar kuch naya nahi to commit hi mat karo.
          # Har 5 minute khali commit karne se history bhar jayegi.
          if git diff --staged --quiet; then
            echo "Kuch naya nahi — commit nahi kiya"
            exit 0
          fi

          # Commit message script ne banaya hai — us mein trading day
          # aur Pakistani waqt dono hain. "Z" (UTC) ab nahi aayega.
          if [ -f output/last_run.txt ]; then
            git commit -F output/last_run.txt
          else
            git commit -m "news update"
          fi

          # Do run takra sakte hain. Teen baar koshish karo.
          for i in 1 2 3; do
            if git push; then
              echo "Push ho gaya"
              exit 0
            fi
            echo "Push nakaam — dobara koshish ($i)"
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "Teen koshishon ke baad bhi push nahi hua"
          exit 1
