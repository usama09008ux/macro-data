name: Fetch News

on:
  workflow_dispatch:          # button se

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Repo ki copy lo
        uses: actions/checkout@v4

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install -r requirements.txt

      - name: Khabrein uthao
        run: python fetch_news.py

      - name: Pack repo mein daalo
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git diff --staged --quiet || git commit -m "news pack"
          git push
